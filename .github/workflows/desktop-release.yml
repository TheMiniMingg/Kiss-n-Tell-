name: Desktop release

# Builds unsigned desktop installers when a version tag is pushed (for example
# `git tag v0.1.0 && git push origin v0.1.0`), and attaches them to a draft
# GitHub Release for review. Can also be run by hand from the Actions tab,
# which builds the installers as downloadable workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match apps/desktop/package.json version ${version}. Bump the version or retag."
            exit 1
          fi

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --bundles nsis
            rust-targets: ""
          - name: macos
            os: macos-latest
            # One app that runs on both Apple Silicon and Intel Macs.
            args: --target universal-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile

      - name: Build installers (draft release on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Kiss N Tell ${{ github.ref_name }}
          releaseBody: |
            Unsigned desktop builds of Kiss N Tell.

            **Windows:** run the `-setup.exe`. Windows SmartScreen may warn that the app is unrecognized: choose **More info → Run anyway**.
            **macOS (Apple Silicon and Intel):** open the `.dmg` and drag Kiss N Tell to Applications. The first time, right-click the app and choose **Open**, or allow it in **System Settings → Privacy & Security**.
          releaseDraft: true
          prerelease: false

      - name: Build installers (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: apps/desktop
        run: pnpm tauri build ${{ matrix.args }}

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiss-n-tell-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
